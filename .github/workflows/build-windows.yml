name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'pyproject.toml'
  release:
    types: [ created, published ]

env:
  APP_NAME: disk-analyzer-cli
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Verify source files
      run: |
        echo "Checking required files..."
        if (-not (Test-Path "main.py")) { Write-Error "main.py not found"; exit 1 }
        if (-not (Test-Path "scanner.py")) { Write-Error "scanner.py not found"; exit 1 }
        if (-not (Test-Path "tui.py")) { Write-Error "tui.py not found"; exit 1 }
        if (-not (Test-Path "exporter.py")) { Write-Error "exporter.py not found"; exit 1 }
        if (-not (Test-Path "junk_detector.py")) { Write-Error "junk_detector.py not found"; exit 1 }
        echo "All required files present."

    - name: Run PyInstaller
      run: |
        pyinstaller `
          --name "${{ env.APP_NAME }}" `
          --onefile `
          --console `
          --clean `
          --noconfirm `
          --hidden-import rich `
          --hidden-import questionary `
          --hidden-import chardet `
          --add-data "README.md;." `
          main.py
      
      shell: pwsh

    - name: Verify executable
      run: |
        if (-not (Test-Path "dist/${{ env.APP_NAME }}.exe")) {
          Write-Error "Executable was not created successfully"
          exit 1
        }
        $fileSize = (Get-Item "dist/${{ env.APP_NAME }}.exe").Length
        Write-Host "Executable size: $([math]::Round($fileSize / 1MB, 2)) MB"
        Write-Host "Build successful!"

    - name: Test executable (basic)
      run: |
        # Run with --help to verify it works
        .\dist\${{ env.APP_NAME }}.exe --help
      continue-on-error: true

    - name: Upload artifact (PR/Push)
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-windows-${{ github.sha }}
        path: dist/${{ env.APP_NAME }}.exe
        retention-days: 14
        if-no-files-found: error

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ env.APP_NAME }}.exe
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create checksum
      if: always()
      run: |
        $hash = Get-FileHash -Path "dist/${{ env.APP_NAME }}.exe" -Algorithm SHA256
        $hash.Hash | Out-File -FilePath "dist/${{ env.APP_NAME }}.exe.sha256" -Encoding ASCII
        Get-Content "dist/${{ env.APP_NAME }}.exe.sha256"
        
    - name: Upload checksum artifact
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-checksums-${{ github.sha }}
        path: dist/*.sha256
        retention-days: 14

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-windows
    if: always()
    
    steps:
    - name: Display build status
      run: |
        echo "## Build Status" >> $GITHUB_STEP_SUMMARY
        echo "- Windows EXE: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Download the executable from the Artifacts section (for PR/Push)" >> $GITHUB_STEP_SUMMARY
        echo "- Or check the Release assets (for Releases)" >> $GITHUB_STEP_SUMMARY
